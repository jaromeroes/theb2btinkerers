[build]
  command = "npm run build"
  publish = "dist"

# ─────────── Language routing by country ───────────
# Handled by netlify/edge-functions/lang-redirect.ts, which runs on `/` only.
# It is an edge function rather than a [[redirects]] rule because the decision
# needs the request cookie and user agent, and redirect conditions can read
# neither. See the comments in that file for why.

[build.environment]
  # Astro 7 requires Node >= 22.12. Keep this in step with .nvmrc and the
  # `engines` field in package.json.
  NODE_VERSION = "22"

# Cache immutable hashed assets for 1 year
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static assets for 30 days
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ─────────── Security headers ───────────
# CSP origin allowlist, derived from what the built site actually loads:
#   cloud.umami.is        analytics script
#   api-gateway.umami.dev analytics beacon
#   formspree.io          contact form POST (fetch + native fallback)
#   fonts.googleapis.com / fonts.gstatic.com
#                         only used by the standalone pages under /docs and
#                         /clients; the Astro site serves woff2 locally.
# 'unsafe-inline' is required for now: the layout ships inline <script> blocks
# (session tracking) and the pages carry ~600 inline style attributes. Removing
# those would let us drop it and move to nonces.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; connect-src 'self' https://cloud.umami.is https://api-gateway.umami.dev https://formspree.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' https://formspree.io"

# ─────────── Keep client deliverables out of search ───────────
# These paths stay reachable by URL (clients may hold links to them) but must
# never be read or indexed. Two layers, because neither is sufficient alone:
#   robots.txt Disallow  stops compliant crawlers fetching them at all
#   X-Robots-Tag         tells anything that fetches anyway not to index
# The internal brand docs that used to sit under /docs are no longer served;
# they were moved to docs/brand-docs/, outside the published directory.
[[headers]]
  for = "/clients/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  for = "/eaship-calculator/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
